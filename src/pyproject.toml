[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radarinsight-product"
version = "0.1.0"
description = "RadarInsight product data, inference and evaluation package"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
inference = [
  "torch>=2.0",
  "onnxruntime>=1.16",
]
export = [
  "torch>=2.0",
  "onnx>=1.14",
  "onnxruntime>=1.16",
]
dev = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["radar_ln3*", "core*"]
