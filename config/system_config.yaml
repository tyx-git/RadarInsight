radar:
  ip: 192.168.0.100
  port: 12345
  type: XW/SR215-3200C
  track_rate_hz: 2
  range_max_m: 6000
  azimuth_fov_deg: 90
  range_resolution_m: 8.0
  doppler_resolution_mps: 0.5
  zero_doppler_idx: 64
capture:
  save_dir: data/sessions
  log_level: INFO
  async_save: true
  chunk_size: 100
pro_processing:
  raw_root: pro/raw
  output_root: pro/sessions
  dataset_root: data/sessions
  range_scale_to_meter: 1000.0
  use_multires_rd: false
  axis_mapping_mode: calibrated_preferred
  doppler_window: 32
  doppler_windows_to_test:
  - 16
  - 32
  - 64
  doppler_fft_size: 64
  range_window_kind: hann
  doppler_window_kind: hann
  clutter_suppression_mode: median_subtract
  micro_motion_alpha: 0.35
preprocessing:
  window_size_s: 8.0
  overlap: 0.5
  rd_crop_range_win: 32
  rd_crop_doppler_win: 16
  rd_align_smoothing_window: 7
  rd_align_refine_range_radius: 6
  rd_align_refine_doppler_radius: 4
  rd_align_clip_range_margin: 10
  rd_align_clip_doppler_margin: 5
  rd_align_peak_guard_ratio: 1.25
  rd_align_max_range_shift: 4
  rd_align_max_doppler_shift: 2
labeling:
  time_threshold_s: 1.0
  dist_threshold_m: 20.0
  speed_threshold_mps: 3.0
  azimuth_threshold_deg: 5.0
  radar_yaw_deg: 0.0
training:
  data_root: data/tsv
  output_dir: artifacts/checkpoints
  batch_size: 4
  epochs: 30
  learning_rate: 0.0002
  weight_decay: 0.0001
  val_ratio: 0.2
  test_ratio: 0.1
  random_seed: 42
  num_workers: 0
  use_focal_loss: true
  class_balance_beta: 0.995
  focal_gamma: 1.25
  sequence_length: 16
  rd_frames: 24
  rd_height: 64
  rd_width: 64
  rd_input_channels: 12
  include_rd: true
  track_feature_columns:
  - range_m
  - azimuth_deg
  - radial_speed_mps
  - abs_radial_speed_mps
  - speed_mps
  - height_m
  - elevation_deg
  - course_deg
  - amplitude_db
  - noise_db
  - snr_db
  - delta_range_m
  - delta_azimuth_deg
  - speed_delta_mps
  - abs_speed_delta_mps
  - acceleration_mps2
  - turn_rate_degps
  - jerk_mps3
  - turn_acceleration_degps2
  - range_jitter_m
  - snr_delta_db
  - height_delta_m
  - elevation_delta_deg
  - course_delta_deg
  - amplitude_delta_db
  - noise_delta_db
  track_global_feature_columns:
  - clip_range_mean_m
  - clip_range_span_m
  - clip_speed_mean_mps
  - clip_speed_std_mps
  - clip_speed_span_mps
  - clip_abs_speed_mean_mps
  - clip_abs_speed_std_mps
  - clip_abs_speed_max_mps
  - clip_speed_direction_consistency
  - clip_range_monotonicity
  - clip_abs_acceleration_mean_mps2
  - clip_abs_turn_rate_mean_degps
  - clip_abs_jerk_mean_mps3
  - clip_abs_turn_acceleration_mean_degps2
  - clip_range_jitter_std_m
  - clip_speed_zero_crossing_rate
  - clip_azimuth_std_deg
  - clip_snr_mean_db
  - clip_height_mean_m
  - clip_height_span_m
  - clip_elevation_mean_deg
  - clip_elevation_std_deg
  - clip_course_std_deg
  - clip_amplitude_mean_db
  - clip_noise_mean_db
  - clip_speed_energy_low
  - clip_speed_energy_mid
  - clip_speed_energy_low
  - clip_speed_energy_mid
  - clip_speed_energy_high
  - clip_range_energy_low
  - clip_range_energy_mid
  - clip_range_energy_high
  - clip_speed_dominant_frequency_hz
  - clip_range_dominant_frequency_hz
  track_projection_dim: 128
  tcn_channels:
  - 128
  - 128
  - 256
  transformer_layers: 3
  transformer_heads: 4
  transformer_dropout: 0.1
  cross_attention_layers: 2
  cross_attention_heads: 4
  cross_attention_dropout: 0.1
  fusion_hidden_size: 256
  x3d_stem_channels: 24
  x3d_stage_channels:
  - 32
  - 64
  - 128
  - 192
  x3d_stage_depths:
  - 2
  - 3
  - 5
  - 3
  x3d_spatial_strides:
  - 1
  - 2
  - 2
  - 2
  x3d_temporal_strides:
  - 1
  - 1
  - 2
  - 2
  x3d_bottleneck_expansion: 2.25
  x3d_se_ratio: 0.0625
  label_smoothing: 0.05
  track_aux_loss_weight: 0.25
  rd_aux_loss_weight: 0.15
  hierarchical_aux_loss_weight: 0.2
  detail_aux_loss_weight: 0.1
  detail_boundary_loss_weight: 0.2
  detail_boundary_margin: 0.2
  detail_logit_residual_weight: 0.2
  detail_cosine_scale: 16.0
  coarse_label_map:
    human: HumanTarget
    bird: BirdTarget
    drone: DroneTarget
    micro_aircraft: DroneTarget
    small_aircraft: DroneTarget
    large_aircraft: DroneTarget
    vehicle: ShipTarget
    vessel: ShipTarget
    suspected_balloon: OtherTarget
    unknown: UnknownTarget
    clutter: OtherTarget
  include_track: true
  label_granularity: coarse
  track_backbone_type: temporal
  use_track_window_mix: true
  track_window_mix_prob: 0.35
  temporal_2d_branch_channels: 96
  track_short_length: 8
  track_mid_length: 16
  track_long_length: 16
  notes_aux_loss_weight: 0.0
  bird_drone_aux_loss_weight: 0.0
  bird_surface_aux_loss_weight: 0.25
  bird_surface_logit_residual_weight: 0.2
  rd_dominant_fusion_bias: 0.35
  rd_unimodal_logit_residual_weight: 0.18
  bird_rd_aux_loss_weight: 0.15
  bird_surface_rd_aux_loss_weight: 0.2
  bird_surface_prototype_loss_weight: 0.2
  bird_surface_prototype_margin: 0.35
  bird_surface_sampling_boost: 1.25
  bird_surface_triplet_loss_weight: 0.0
  bird_surface_triplet_margin: 0.4
  track_router_aux_loss_weight: 0.15
  rd_bird_drone_aux_loss_weight: 0.15
  rd_ship_drone_aux_loss_weight: 0.06
  rd_ship_bird_aux_loss_weight: 0.06
  ship_specialist_logit_residual_weight: 0.0
  rd_ship_air_aux_loss_weight: 0.04
  best_metric_name: val_composite
  best_metric_weights:
    val_macro_f1: 0.7
    val_accuracy: 0.3
  early_stopping_patience: 6
  early_stopping_min_delta: 0.002
tsv_processing:
  raw_root: pro/excel
  output_root: pro/tsv
  dataset_root: data/tsv
